name: crypto_trading_app
description: Professional Crypto Trading App with AI Signals - Android & Web
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0
  firebase_storage: ^11.6.0
  firebase_messaging: ^14.7.10

  provider: ^6.1.1
  http: ^1.1.2
  web_socket_channel: ^2.4.0
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  fl_chart: ^0.66.0
  syncfusion_flutter_charts: ^24.1.41

  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0

  intl: ^0.18.1
  shared_preferences: ^2.2.2
  connectivity_plus: ^5.0.2

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
